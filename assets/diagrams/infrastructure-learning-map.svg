<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Cloud Infrastructure Labs: Learning and System Map</title>
  <desc id="description">A reading sequence from cloud infrastructure to K-PaaS platform assembly, application delivery, and Kubernetes operations. The NHN Cloud lab has one control plane, three workers, and a separate NFS server. AWS labs are separate explorations, not components of the K-PaaS environment. The top arrows indicate reading order. Dashed connectors show cluster coordination. Solid connectors summarize an Ingress request example and NFS-backed storage relationships; workload placement varies by experiment.</desc>
  <!--
    Design process: retain the current white canvas, muted blue accents, typography,
    rounded cards, reading path, and separate AWS summary. Select three structural
    motifs from 3d69ddd: control-plane fan-out, Pod/PVC/PV/NFS relationships, and an
    Ingress request path. Keep the detailed component inventories in the documents.
    Use a cluster boundary to distinguish three workers from the separate NFS server.
    Dashed coordination lines and solid example paths distinguish their meanings.
    Sources: infrastructure setup, cluster installation, Services/Ingress, storage labs.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#7c90aa" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #25364b; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 23px; fill: #65758b; }
      .label { font-size: 19px; font-weight: 700; letter-spacing: 1.6px; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; fill: #51657c; }
      .small { font-size: 20px; fill: #65758b; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-body { font-size: 20px; fill: #51657c; }
      .flow { fill: none; stroke: #7c90aa; stroke-width: 2; marker-end: url(#arrow); }
      .detail { font-size: 18px; fill: #65758b; }
      .coordination { fill: none; stroke: #7c90aa; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .divider { stroke: #dce4ef; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1120" rx="24" fill="#ffffff"/>
  <rect x="64" y="48" width="6" height="76" rx="3" fill="#587ca9"/>
  <text x="92" y="81" class="title">From cloud resources to running applications</text>
  <text x="92" y="120" class="subtitle">Cloud Infrastructure Labs · setup, system behavior, and troubleshooting</text>

  <text x="64" y="169" class="label" fill="#587ca9">THE MAIN READING PATH</text>
  <text x="1376" y="169" text-anchor="end" class="small">Arrows indicate learning sequence</text>

  <!-- Four equal cards establish the reading hierarchy before the lab topology. -->
  <g>
    <rect x="64" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#dce4ef"/>
    <rect x="64" y="194" width="304" height="6" rx="3" fill="#587ca9"/>
    <text x="88" y="239" class="label">01 / FOUNDATIONS</text>
    <text x="88" y="280" class="heading">Cloud infrastructure</text>
    <text x="88" y="322" class="body">Instances and SSH</text>
    <text x="88" y="356" class="body">Subnets and routing</text>
    <text x="88" y="390" class="body">Floating IPs and NFS</text>
    <text x="88" y="426" class="small">Prepare the environment</text>
  </g>
  <path d="M 376 320 H 392" class="flow"/>
  <g>
    <rect x="400" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#dce4ef"/>
    <rect x="400" y="194" width="304" height="6" rx="3" fill="#587ca9"/>
    <text x="424" y="239" class="label">02 / PLATFORM</text>
    <text x="424" y="280" class="heading">K-PaaS assembly</text>
    <text x="424" y="322" class="body">Kubernetes cluster</text>
    <text x="424" y="356" class="body">Portal and source control</text>
    <text x="424" y="390" class="body">Pipeline and OpenBao</text>
    <text x="424" y="426" class="small">Connect platform services</text>
  </g>
  <path d="M 712 320 H 728" class="flow"/>
  <g>
    <rect x="736" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#dce4ef"/>
    <rect x="736" y="194" width="304" height="6" rx="3" fill="#587ca9"/>
    <text x="760" y="239" class="label">03 / DELIVERY</text>
    <text x="760" y="280" class="heading">Application delivery</text>
    <text x="760" y="322" class="body">Build, analysis, and tests</text>
    <text x="760" y="356" class="body">Images and deployment</text>
    <text x="760" y="390" class="body">Spring Music and MSA</text>
    <text x="760" y="426" class="small">Trace the delivery workflow</text>
  </g>
  <path d="M 1048 320 H 1064" class="flow"/>
  <g>
    <rect x="1072" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#dce4ef"/>
    <rect x="1072" y="194" width="304" height="6" rx="3" fill="#587ca9"/>
    <text x="1096" y="239" class="label">04 / OPERATIONS</text>
    <text x="1096" y="280" class="heading">Workload behavior</text>
    <text x="1096" y="322" class="body">Services and Ingress</text>
    <text x="1096" y="356" class="body">Configuration and storage</text>
    <text x="1096" y="390" class="body">Scheduling and rollouts</text>
    <text x="1096" y="426" class="small">Observe, debug, and clean up</text>
  </g>

  <!-- Three selected system views add relationships without service inventories. -->
  <rect x="64" y="478" width="1312" height="420" rx="16" fill="#f3f6fb" stroke="#dce4ef"/>
  <text x="88" y="521" class="label">K-PAAS LAB / NHN CLOUD</text>
  <text x="1352" y="521" class="small" text-anchor="end">Five Ubuntu instances · one cluster + shared storage</text>

  <!-- Cluster coordination: one control plane and three workers. -->
  <rect x="88" y="548" width="832" height="218" rx="12" fill="none" stroke="#dce4ef"/>
  <text x="108" y="584" class="label">KUBERNETES</text>
  <text x="108" y="615" class="detail">1 control plane</text>
  <text x="108" y="643" class="detail">3 worker nodes</text>
  <rect x="336" y="566" width="336" height="66" rx="12" fill="#ffffff"/>
  <text x="504" y="593" class="node-title" text-anchor="middle">Control plane / cluster1</text>
  <text x="504" y="619" class="detail" text-anchor="middle">API server · controllers</text>
  <path d="M 504 632 V 650 H 232 V 666" class="coordination"/>
  <path d="M 504 632 V 666" class="coordination"/>
  <path d="M 504 632 V 650 H 776 V 666" class="coordination"/>
  <g>
    <rect x="108" y="672" width="248" height="74" rx="12" fill="#ffffff"/>
    <text x="232" y="703" class="node-title" text-anchor="middle">Worker / cluster2</text>
    <text x="232" y="730" class="detail" text-anchor="middle">Application + platform Pods</text>
    <rect x="380" y="672" width="248" height="74" rx="12" fill="#ffffff"/>
    <text x="504" y="703" class="node-title" text-anchor="middle">Worker / cluster3</text>
    <text x="504" y="730" class="detail" text-anchor="middle">Application + platform Pods</text>
    <rect x="652" y="672" width="248" height="74" rx="12" fill="#ffffff"/>
    <text x="776" y="703" class="node-title" text-anchor="middle">Worker / cluster4</text>
    <text x="776" y="730" class="detail" text-anchor="middle">Application + platform Pods</text>
  </g>

  <!-- Storage relationships: the NFS server sits outside the cluster boundary. -->
  <rect x="944" y="548" width="408" height="218" rx="12" fill="none" stroke="#dce4ef"/>
  <text x="968" y="584" class="label">PERSISTENT STORAGE</text>
  <text x="968" y="615" class="detail">Shared volumes for workloads</text>
  <rect x="968" y="634" width="96" height="38" rx="8" fill="#ffffff"/>
  <text x="1016" y="660" class="node-body" text-anchor="middle">Pod</text>
  <rect x="1100" y="634" width="96" height="38" rx="8" fill="#ffffff"/>
  <text x="1148" y="660" class="node-body" text-anchor="middle">PVC</text>
  <rect x="1232" y="634" width="96" height="38" rx="8" fill="#ffffff"/>
  <text x="1280" y="660" class="node-body" text-anchor="middle">PV</text>
  <path d="M 1072 653 H 1092" class="flow"/>
  <path d="M 1204 653 H 1224" class="flow"/>
  <path d="M 1280 672 V 690 H 1148 V 702" class="flow"/>
  <rect x="968" y="708" width="360" height="38" rx="8" fill="#ffffff"/>
  <text x="1148" y="734" class="node-body" text-anchor="middle">NFS server / cluster5</text>

  <!-- One request example; the lab also explores other Service types. -->
  <text x="88" y="799" class="label">REQUEST PATH / INGRESS EXAMPLE</text>
  <rect x="88" y="818" width="200" height="40" rx="8" fill="#ffffff"/>
  <text x="188" y="845" class="node-body" text-anchor="middle">Browser</text>
  <rect x="328" y="818" width="220" height="40" rx="8" fill="#ffffff"/>
  <text x="438" y="845" class="node-body" text-anchor="middle">Floating IP</text>
  <rect x="588" y="818" width="264" height="40" rx="8" fill="#ffffff"/>
  <text x="720" y="845" class="node-body" text-anchor="middle">Ingress controller</text>
  <rect x="892" y="818" width="200" height="40" rx="8" fill="#ffffff"/>
  <text x="992" y="845" class="node-body" text-anchor="middle">Service</text>
  <rect x="1132" y="818" width="220" height="40" rx="8" fill="#ffffff"/>
  <text x="1242" y="845" class="node-body" text-anchor="middle">Application Pods</text>
  <path d="M 296 838 H 320" class="flow"/>
  <path d="M 556 838 H 580" class="flow"/>
  <path d="M 860 838 H 884" class="flow"/>
  <path d="M 1100 838 H 1124" class="flow"/>
  <text x="88" y="884" class="detail">Dashed: cluster coordination · Solid: request or storage relationships · Workload placement varies by experiment</text>

  <text x="64" y="943" class="label">PARALLEL AWS EXPLORATIONS</text>
  <text x="1376" y="943" class="small" text-anchor="end">Separate labs and concept notes</text>
  <g>
    <rect x="64" y="964" width="304" height="104" rx="12" fill="#f5f8fc" stroke="#dce5f0"/>
    <text x="88" y="1004" class="node-title">AWS foundations</text>
    <text x="88" y="1038" class="node-body">Compute, storage, and VPC</text>
    <rect x="400" y="964" width="304" height="104" rx="12" fill="#f5f8fc" stroke="#dce5f0"/>
    <text x="424" y="1004" class="node-title">Amazon EKS</text>
    <text x="424" y="1038" class="node-body">Images and web deployment</text>
    <rect x="736" y="964" width="304" height="104" rx="12" fill="#f5f8fc" stroke="#dce5f0"/>
    <text x="760" y="1004" class="node-title">GitLab CI/CD</text>
    <text x="760" y="1038" class="node-body">Setup and delivery pipelines</text>
    <rect x="1072" y="964" width="304" height="104" rx="12" fill="#f5f8fc" stroke="#dce5f0"/>
    <text x="1096" y="1004" class="node-title">Amazon Bedrock</text>
    <text x="1096" y="1038" class="node-body">Knowledge bases and agents</text>
  </g>
</svg>

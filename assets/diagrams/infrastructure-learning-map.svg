      .white { fill: #FFFFFF; }
      .muted { fill: #58697E; }
      .blue { fill: #326CE5; }
      .teal { fill: #178777; }
      .amber { fill: #C77612; }
      .violet { fill: #7661A8; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #326CE5; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#blue-arrow); }
      .traffic { fill: none; stroke: #178777; stroke-width: 2; marker-end: url(#teal-arrow); }
      .workflow { fill: none; stroke: #C77612; stroke-width: 2; marker-end: url(#amber-arrow); }
    </style>

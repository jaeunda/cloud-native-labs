<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Cloud Infrastructure Labs: Learning Map</title>
  <desc id="description">A reading sequence from cloud infrastructure to K-PaaS platform assembly, application delivery, and Kubernetes operations. The NHN Cloud lab has one control plane, three workers, and a separate NFS server. AWS labs are separate explorations, not components of the K-PaaS environment. Arrows in the top row indicate reading order, not network traffic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#536676" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183244; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 23px; fill: #526775; }
      .label { font-size: 19px; font-weight: 700; letter-spacing: 1.6px; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; fill: #3e5666; }
      .small { font-size: 20px; fill: #526775; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-body { font-size: 20px; fill: #3e5666; }
      .flow { fill: none; stroke: #536676; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #d1dce0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="960" rx="24" fill="#f5f7f5"/>
  <rect x="64" y="48" width="6" height="76" rx="3" fill="#187b75"/>
  <text x="92" y="81" class="title">From cloud resources to running applications</text>
  <text x="92" y="120" class="subtitle">Cloud Infrastructure Labs · setup, system behavior, and troubleshooting</text>

  <text x="64" y="169" class="label" fill="#187b75">THE MAIN READING PATH</text>
  <text x="1376" y="169" text-anchor="end" class="small">Arrows indicate learning sequence</text>

  <!-- Four equal cards establish the reading hierarchy before the lab topology. -->
  <g>
    <rect x="64" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#cbd9d8"/>
    <rect x="64" y="194" width="304" height="6" rx="3" fill="#187b75"/>
    <text x="88" y="239" class="label">01 / FOUNDATIONS</text>
    <text x="88" y="280" class="heading">Cloud infrastructure</text>
    <text x="88" y="322" class="body">Instances and SSH</text>
    <text x="88" y="356" class="body">Subnets and routing</text>
    <text x="88" y="390" class="body">Floating IPs and NFS</text>
    <text x="88" y="426" class="small">Prepare the environment</text>
  </g>
  <path d="M 376 320 H 392" class="flow"/>
  <g>
    <rect x="400" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#cbd9d8"/>
    <rect x="400" y="194" width="304" height="6" rx="3" fill="#187b75"/>
    <text x="424" y="239" class="label">02 / PLATFORM</text>
    <text x="424" y="280" class="heading">K-PaaS assembly</text>
    <text x="424" y="322" class="body">Kubernetes cluster</text>
    <text x="424" y="356" class="body">Portal and source control</text>
    <text x="424" y="390" class="body">Pipeline and OpenBao</text>
    <text x="424" y="426" class="small">Connect platform services</text>
  </g>
  <path d="M 712 320 H 728" class="flow"/>
  <g>
    <rect x="736" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#cbd9d8"/>
    <rect x="736" y="194" width="304" height="6" rx="3" fill="#187b75"/>
    <text x="760" y="239" class="label">03 / DELIVERY</text>
    <text x="760" y="280" class="heading">Application delivery</text>
    <text x="760" y="322" class="body">Build, analysis, and tests</text>
    <text x="760" y="356" class="body">Images and deployment</text>
    <text x="760" y="390" class="body">Spring Music and MSA</text>
    <text x="760" y="426" class="small">Trace the delivery workflow</text>
  </g>
  <path d="M 1048 320 H 1064" class="flow"/>
  <g>
    <rect x="1072" y="194" width="304" height="252" rx="16" fill="#ffffff" stroke="#cbd9d8"/>
    <rect x="1072" y="194" width="304" height="6" rx="3" fill="#187b75"/>
    <text x="1096" y="239" class="label">04 / OPERATIONS</text>
    <text x="1096" y="280" class="heading">Workload behavior</text>
    <text x="1096" y="322" class="body">Services and Ingress</text>
    <text x="1096" y="356" class="body">Configuration and storage</text>
    <text x="1096" y="390" class="body">Scheduling and rollouts</text>
    <text x="1096" y="426" class="small">Observe, debug, and clean up</text>
  </g>

  <!-- Inventory diagram: explicit roles without invented traffic or HA paths. -->
  <rect x="64" y="478" width="1312" height="260" rx="16" fill="#eaf1ef" stroke="#cbd9d8"/>
  <text x="88" y="521" class="label">K-PAAS LAB / NHN CLOUD</text>
  <text x="1352" y="521" class="small" text-anchor="end">Five Ubuntu instances · roles recorded in the setup notes</text>
  <g>
    <rect x="88" y="548" width="280" height="124" rx="12" fill="#ffffff"/>
    <text x="110" y="584" class="node-title">1 control plane</text>
    <text x="110" y="619" class="node-body">API server and controllers</text>
    <text x="110" y="650" class="node-body">Cluster coordination</text>
  </g>
  <g>
    <rect x="392" y="548" width="656" height="124" rx="12" fill="#ffffff"/>
    <text x="414" y="584" class="node-title">3 worker nodes</text>
    <text x="414" y="619" class="node-body">Application Pods and platform workloads</text>
    <rect x="414" y="636" width="190" height="22" rx="5" fill="#dcebe6"/>
    <rect x="626" y="636" width="190" height="22" rx="5" fill="#dcebe6"/>
    <rect x="838" y="636" width="188" height="22" rx="5" fill="#dcebe6"/>
  </g>
  <g>
    <rect x="1072" y="548" width="280" height="124" rx="12" fill="#ffffff"/>
    <text x="1094" y="584" class="node-title">1 NFS server</text>
    <text x="1094" y="619" class="node-body">Shared storage</text>
    <text x="1094" y="650" class="node-body">PV / PVC experiments</text>
  </g>
  <text x="88" y="710" class="small">Infrastructure setup → cluster and platform installation → application deployment → resource cleanup</text>

  <text x="64" y="783" class="label">PARALLEL AWS EXPLORATIONS</text>
  <text x="1376" y="783" class="small" text-anchor="end">Separate labs and concept notes</text>
  <g>
    <rect x="64" y="804" width="304" height="104" rx="12" fill="#eaf0f8" stroke="#ced9e7"/>
    <text x="88" y="844" class="node-title">AWS foundations</text>
    <text x="88" y="878" class="node-body">Compute, storage, and VPC</text>
    <rect x="400" y="804" width="304" height="104" rx="12" fill="#eaf0f8" stroke="#ced9e7"/>
    <text x="424" y="844" class="node-title">Amazon EKS</text>
    <text x="424" y="878" class="node-body">Images and web deployment</text>
    <rect x="736" y="804" width="304" height="104" rx="12" fill="#eaf0f8" stroke="#ced9e7"/>
    <text x="760" y="844" class="node-title">GitLab CI/CD</text>
    <text x="760" y="878" class="node-body">Setup and delivery pipelines</text>
    <rect x="1072" y="804" width="304" height="104" rx="12" fill="#eaf0f8" stroke="#ced9e7"/>
    <text x="1096" y="844" class="node-title">Amazon Bedrock</text>
    <text x="1096" y="878" class="node-body">Knowledge bases and agents</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title description">
  <title id="title">Cloud Infrastructure Labs: Systems and Learning Map</title>
  <desc id="description">Overview informed by the repository's original diagrams and screenshots. Cloud models, containers, DevOps, microservices, and Saga form the conceptual foundation. The NHN Cloud K-PaaS environment has one Kubernetes control plane, three workers, and a separate NFS server. Platform services support application delivery. A simplified Ingress traffic path, storage relationships, configuration, scheduling, and workload operations connect the labs. Separate AWS explorations cover infrastructure, EKS and ECR, GitLab deployment to S3, and Bedrock knowledge bases and agents.</desc>
  <!--
    Design process: reviewed all 347 available image URLs across the concept and lab
    documents; five original local image references have no corresponding files.
    Source motifs: nested cloud/cluster boundaries, control-plane fan-out, Pod cubes,
    PVC/PV/storage cylinders, horizontal delivery stages, and Ingress routing paths.
    Palette: navy from terminal/platform chrome; Kubernetes blue from cluster diagrams;
    teal for network/storage; amber for compute/delivery; violet for distributed/AI topics.
    One system: 12px corners, 2px outlines, orthogonal connectors, shared text hierarchy.
    Dashed arrows encode cluster coordination. Solid arrows encode the labeled example
    or workflow only. AWS concept notes and labs remain outside the NHN Cloud boundary.
  -->
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202D40; }
      .hero { font-size: 46px; font-weight: 700; letter-spacing: -1px; fill: #FFFFFF; }
      .hero-sub { font-size: 24px; fill: #C8D5E9; }
      .section { font-size: 30px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
